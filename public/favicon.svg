<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2b6d" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2a0d18" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ff0055" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff0055" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10" />

  <!-- Center Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#aura)" />

  <!-- Monogram RB (Bold Cyber/Modern Tech) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="220" letter-spacing="-6">
    <!-- 'R' in Neon Crimson with Glow -->
    <text x="96" y="336" fill="url(#rGrad)" filter="url(#neonGlow)">R</text>
    <text x="96" y="336" fill="#ffffff" opacity="0.15">R</text>
    
    <!-- 'B' in Pure Titanium White -->
    <text x="248" y="336" fill="#f8fafc">B</text>
  </g>

  <!-- Active Status Indicator Dot (Emerald Green at top right) -->
  <circle cx="414" cy="98" r="26" fill="#10b981" opacity="0.35" />
  <circle cx="414" cy="98" r="16" fill="#00ff88" stroke="#0c0d12" stroke-width="4" />
</svg>
